[project]
name = "agent-skills"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
validation = [
    "bandit>=1.9",
    "pyright>=1.1",
    "ruff>=0.12",
    "tiktoken>=0.7",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]
allowed-confusables = ["×"]

[tool.pyright]
include = [
    "skills/agents-md-comparator/scripts",
    "skills/handoff/scripts",
    "skills/mutation-testing-loop/scripts",
    "skills/mutation-testing-loop/tests",
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.bandit]
# These scripts intentionally launch trusted local tools without a shell.
# B608 misclassifies generated natural-language prompts as SQL expressions.
skips = ["B404", "B603", "B607", "B608"]
