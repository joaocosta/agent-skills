[project]
name = "agent-skills"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
validation = [
    "bandit>=1.9",
    "pyright>=1.1",
    "ruff>=0.12",
    "tiktoken>=0.7",
]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF",
    "A", "ARG", "ASYNC", "DTZ", "ERA", "EXE", "G", "LOG", "PERF",
    "PGH", "PTH", "RET", "RSE", "SLF", "T10",
]
ignore = ["E501"]
allowed-confusables = ["×"]

[tool.pyright]
include = [
    "skills/agents-md-comparator/scripts",
    "skills/beads-handoff/scripts",
    "skills/handoff/scripts",
    "skills/mutation-testing-loop/scripts",
    "skills/mutation-testing-loop/tests",
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
deprecateTypingAliases = true
reportCallInDefaultInitializer = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"

[tool.bandit]
# These scripts intentionally launch trusted local tools without a shell.
# B608 misclassifies generated natural-language prompts as SQL expressions.
skips = ["B404", "B603", "B607", "B608"]
